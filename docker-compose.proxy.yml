# Docker Compose for Reverse Proxy Mode
# Use this when running behind Nginx Proxy Manager, Traefik, Caddy, or other reverse proxies
#
# Usage:
#   docker compose -f docker-compose.proxy.yml up -d
#
# Configure in .env:
#   APP_URL=https://panel.yourdomain.com
#   PROXY_PORT=8080
#   TRUSTED_PROXIES=*

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: production
    container_name: upanel-app
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    volumes:
      - ./storage:/var/www/storage
      - ./.env:/var/www/.env
      - ./public:/var/www/public
    networks:
      - upanel
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: upanel-nginx
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/public:ro
      - ./storage/app/public:/var/www/storage/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - upanel
      - proxy-tier
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: upanel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-upanel}
      POSTGRES_USER: ${DB_USERNAME:-upanel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - upanel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-upanel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: upanel-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    volumes:
      - redis_data:/data
    networks:
      - upanel
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: production
    container_name: upanel-queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    volumes:
      - ./storage:/var/www/storage
      - ./.env:/var/www/.env
    networks:
      - upanel
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: production
    container_name: upanel-scheduler
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    volumes:
      - ./storage:/var/www/storage
      - ./.env:/var/www/.env
    networks:
      - upanel
    depends_on:
      postgres:
        condition: service_healthy

networks:
  upanel:
    driver: bridge
  proxy-tier:
    external: true

volumes:
  postgres_data:
  redis_data:
